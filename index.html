
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My To-Do List</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>My To-Do List</h1>
    <p class="subtitle">Plan your day, one task at a time.</p>

    <form id="form">
      <input id="text" type="text" placeholder="Enter a task..." autocomplete="off">
      <button type="submit">Add Task</button>
    </form>

    <div class="filters">
      <button type="button" data-filter="all">All</button>
      <button type="button" data-filter="active">Active</button>
      <button type="button" data-filter="done">Completed</button>
    </div>

    <ul id="list"></ul>

    <div class="footer">
      <p id="count">0 left</p>
      <button type="button" id="clear">Clear completed</button>
    </div>
  </main>
</body>
</html>
